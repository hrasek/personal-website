name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only access is enough: the workflow only runs checks.
permissions:
  contents: read

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Prettier + ESLint)
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build API (Azure Functions)
        run: npm run build:api
